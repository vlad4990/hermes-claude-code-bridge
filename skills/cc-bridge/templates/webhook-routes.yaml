# Hermes webhook routes for the `webhook` sink of ccb (payload contract: references/event-contract.md).
#
# Two ways to install:
#   a) scripts/install.sh creates them with `hermes webhook subscribe` (hot-reloaded, no gateway
#      restart) and then patches ~/.hermes/webhook_subscriptions.json to add `toolsets`, which the
#      CLI deliberately cannot set.
#   b) paste this block into ~/.hermes/config.yaml under platforms.webhook.extra.routes
#      (static routes win over dynamic ones with the same name; needs a gateway restart).
#
# Prereqs: WEBHOOK_ENABLED=true in ~/.hermes/.env (port 8644 by default). ccb only talks to
# loopback; keep the adapter bound to 127.0.0.1. Auth is HMAC-SHA256 v2 (X-Webhook-Signature-V2
# + X-Webhook-Timestamp); `secret` must equal webhook_secret in ~/.config/ccb/config.json.
#
# Payload fields you can template: {title} {text} {kind} {name} {status} {request_id}
# {reply_hint} {answer_command} {questions} {permission} {last_message} {marker} {tail} {cwd}.
# Nested fields are JSON-serialised and truncated at 2000 chars by Hermes.

platforms:
  webhook:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 8644
      routes:

        # Zero-LLM path: Claude finished a turn / is done / session ended. {text} is already
        # human-readable, so the rendered template IS the message.
        ccb-notify:
          secret: "${CCB_WEBHOOK_SECRET}"
          events: ["notify"]
          script: "ccb-filter.py"          # ~/.hermes/scripts/ccb-filter.py
          deliver: "telegram"
          deliver_only: true
          prompt: "{text}"
          # deliver_extra:
          #   chat_id: "123456789"          # omit → the platform's home channel
          #   message_thread_id: "42"       # optional forum topic

        # Agent path: Claude Code is blocked on a human (AskUserQuestion or a permission).
        # The agent rephrases the question in the human's language and relays the reply with
        # `ccb answer` — hence `toolsets: [terminal]` (manual edit; the CLI cannot grant it).
        #
        # Zero-LLM alternative: set `deliver_only: true` and `prompt: "{text}"` here too. The
        # human then replies in Telegram and the Telegram-session agent (with the cc-bridge skill
        # loaded) runs `ccb answer` — procedure C in SKILL.md.
        ccb-ask:
          secret: "${CCB_WEBHOOK_SECRET}"
          events: ["ask"]
          script: "ccb-filter.py"
          skills: ["cc-bridge"]
          toolsets: ["terminal"]
          deliver: "telegram"
          prompt: |
            event: ask
            A Claude Code session needs the human. Follow the cc-bridge skill, procedure B.
            Relay the question below to the human in one message in their language, keep the
            option numbers exactly as given, then stop and wait for the reply.
            {title}
            kind: {kind}
            name: {name}
            request_id: {request_id}
            reply_hint: {reply_hint}
            answer_command: {answer_command}
            --- message ---
            {text}
            --- last screen lines ---
            {tail}
